<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트띵동 - AI 상담</title>

    <!-- Firebase SDK (v9 Compat - 전역 firebase 객체 사용 가능 버전) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0f0f0f;
            --secondary-dark: #1a1a1a;
            --tertiary-dark: #2d2d2d;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --message-user-bg: #8b5cf6;
            --message-ai-bg: #2d2d2d;
        }

        html, body {
            height: 100%;
            width: 100%;
            background: var(--primary-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
            background: var(--primary-dark);
        }

        .header {
            position: fixed;
            top: 0;
            left: 300px;
            right: 0;
            height: 80px;
            background: linear-gradient(135deg, var(--secondary-dark) 0%, var(--tertiary-dark) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 0 32px;
            display: flex;
            align-items: center;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 24px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .consultation-info {
            display: flex;
            gap: 24px;
            margin-left: auto;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .info-item .label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-item .value {
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .chat-container {
            position: fixed;
            top: 80px;
            left: 300px;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            background: var(--primary-dark);
        }

        .messages-wrapper {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px 32px;
            flex: 1;
        }

        .message-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        .placeholder-text {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .message {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: var(--message-user-bg);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: var(--message-ai-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .message-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0 8px;
        }

        .input-area {
            padding: 24px 32px;
            border-top: 1px solid var(--border-color);
            background: var(--secondary-dark);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            background: var(--tertiary-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .message-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .message-input:disabled {
            background: var(--tertiary-dark);
            color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .send-button {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(139, 92, 246, 0.3);
        }

        .send-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            background: var(--secondary-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 200;
        }

        .sidebar-header {
            padding: 24px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .new-session-btn {
            width: 100%;
            background: var(--accent-purple);
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .new-session-btn:hover {
            background: #a78bfa;
            transform: translateY(-1px);
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }

        .session-item {
            padding: 12px;
            margin-bottom: 8px;
            background: var(--tertiary-dark);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            border-left: 3px solid transparent;
        }

        .session-item:hover {
            background: var(--tertiary-dark);
            border-color: var(--accent-purple);
        }

        .session-item.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), transparent);
            border-left-color: var(--accent-purple);
        }

        .session-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-meta {
            display: flex;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .session-meta span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loading-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--tertiary-dark);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex-direction: row;
                max-height: 200px;
            }
            .header {
                left: 0;
                top: 0;
            }
            .chat-container {
                left: 0;
                top: 80px;
            }
            .message-content {
                max-width: 80%;
            }
            .sidebar-header {
                width: auto;
            }
            .sessions-list {
                display: flex;
                overflow-x: auto;
                padding: 12px;
            }
            .session-item {
                flex-shrink: 0;
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="logo">프로젝트띵동</div>
                <div class="consultation-info">
                    <div class="info-item">
                        <span class="label">상담유형</span>
                        <span class="value" id="modeDisplay">대기중...</span>
                    </div>
                    <div class="info-item">
                        <span class="label">감정</span>
                        <span class="value" id="emotionDisplay">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container">
            <div class="messages-wrapper">
                <div class="messages" id="messagesContainer">
                    <div class="message-placeholder">
                        <div class="placeholder-text">상담 세션을 선택하거나 새로 생성하세요</div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="messageInput"
                        class="message-input"
                        placeholder="메시지를 입력하세요..."
                        disabled
                    >
                    <button class="send-button" id="sendButton" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>상담 세션</h3>
                <button class="new-session-btn" id="newSessionBtn">+ 새 상담</button>
            </div>
            <div class="sessions-list" id="sessionsList">
                <div class="loading-indicator">로딩중...</div>
            </div>
        </div>
    </div>

    <script>
        // 1. Firebase Config 설정 (실제 프로젝트 값으로 수정해 주세요)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 2. Firebase 초기화
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 3. 상태 변수
        let currentDocId = null;
        let unsubscribeDocListener = null; // 선택된 문서 실시간 구독 해제용

        // 4. DOM 요소
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sessionsList = document.getElementById('sessionsList');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const modeDisplay = document.getElementById('modeDisplay');
        const emotionDisplay = document.getElementById('emotionDisplay');

        // 5. 이벤트 리스너
        document.addEventListener('DOMContentLoaded', () => {
            newSessionBtn.addEventListener('click', createNewSession);
            sendButton.addEventListener('click', handleSendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });

            loadConsultations();
        });

        // 6. consultations 컬렉션 불러오기
        function loadConsultations() {
            db.collection('consultations')
                .orderBy('created_at', 'desc')
                .onSnapshot((snapshot) => {
                    sessionsList.innerHTML = '';

                    if (snapshot.empty) {
                        sessionsList.innerHTML = '<div class="loading-indicator">상담 내역이 없습니다.</div>';
                        return;
                    }

                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const sessionEl = createSessionItemElement(doc.id, data);
                        sessionsList.appendChild(sessionEl);
                    });
                }, (error) => {
                    console.error("Error loading consultations:", error);
                    sessionsList.innerHTML = '<div class="loading-indicator">상담 데이터를 불러올 수 없습니다.</div>';
                });
        }

        // 사이드바 목록 항목 생성
        function createSessionItemElement(docId, data) {
            const div = document.createElement('div');
            div.className = `session-item ${docId === currentDocId ? 'active' : ''}`;
            div.dataset.id = docId;

            // 상담 유형 및 감정 추출
            const mode = data.analysis_summary?.mode_name || '일반 상담';

            // 대화 목록의 첫 메시지나 ID로 제목 표시
            let title = docId;
            if (data.consultation_dialogue && data.consultation_dialogue.length > 0) {
                const firstUserMsg = data.consultation_dialogue.find(d => d.speaker === 'User');
                if (firstUserMsg) title = firstUserMsg.message;
            }

            // 날짜 포맷
            let dateStr = '';
            if (data.created_at) {
                const dateObj = new Date(data.created_at);
                dateStr = isNaN(dateObj) ? '' : dateObj.toLocaleDateString();
            }

            div.innerHTML = `
                <div class="session-title">${escapeHTML(title)}</div>
                <div class="session-meta">
                    <span>${escapeHTML(mode)}</span>
                    ${dateStr ? `<span>•</span><span>${dateStr}</span>` : ''}
                </div>
            `;

            div.addEventListener('click', () => selectConsultation(docId));
            return div;
        }

        // 7. 상담 문서 선택 및 대화 바인딩
        function selectConsultation(docId) {
            currentDocId = docId;

            // 기존 문서 실시간 리스너 해제 후 새로 연결
            if (unsubscribeDocListener) unsubscribeDocListener();

            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();

            // 사이드바 활성화 스타일 지정
            document.querySelectorAll('.session-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === docId);
            });

            // 문서 실시간 감시 (consultation_dialogue 업데이트 수신)
            unsubscribeDocListener = db.collection('consultations').doc(docId)
                .onSnapshot((doc) => {
                    if (!doc.exists) return;
                    const data = doc.data();

                    // 헤더 정보 업데이트
                    modeDisplay.textContent = data.analysis_summary?.mode_name || '일반 상담';
                    emotionDisplay.textContent = data.analysis_summary?.primary_emotion || '중립';

                    // 대화 목록 렌더링
                    renderDialogue(data.consultation_dialogue || []);
                });
        }

        // 8. 대화 목록(consultation_dialogue) 화면 렌더링
        function renderDialogue(dialogueArray) {
            messagesContainer.innerHTML = '';

            if (!dialogueArray || dialogueArray.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="message-placeholder">
                        <div class="placeholder-text">대화 내용이 없습니다. 먼저 메시지를 보내보세요!</div>
                    </div>`;
                return;
            }

            dialogueArray.forEach((item) => {
                // speaker 필드가 "User"이면 user, 그 외에는 ai 클래스 지정
                const senderClass = (item.speaker && item.speaker.toLowerCase() === 'user') ? 'user' : 'ai';
                appendMessageUI(item.message, senderClass, item.timestamp);
            });

            scrollToBottom();
        }

        // 9. 메시지 UI 출력 헬퍼
        function appendMessageUI(text, sender, timestamp) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            let timeStr = '';
            if (timestamp) {
                const d = new Date(timestamp);
                timeStr = isNaN(d) ? timestamp : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
                timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            msgDiv.innerHTML = `
                ${sender === 'user' ? `<span class="message-time">${timeStr}</span>` : ''}
                <div class="message-content">${escapeHTML(text)}</div>
                ${sender === 'ai' ? `<span class="message-time">${timeStr}</span>` : ''}
            `;

            messagesContainer.appendChild(msgDiv);
        }

        // 10. 메시지 전송 (consultation_dialogue 배열에 추가)
        async function handleSendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentDocId) return;

            messageInput.value = '';

            const nowIso = new Date().toISOString();
            const newUserMessage = {
                speaker: "User",
                message: text,
                timestamp: nowIso
            };

            try {
                // consultation_dialogue 배열에 새 사용자 메시지 추가
                const docRef = db.collection('consultations').doc(currentDocId);
                await docRef.update({
                    consultation_dialogue: firebase.firestore.FieldValue.arrayUnion(newUserMessage)
                });

                // AI 응답 시뮬레이션
                simulateAIResponse(currentDocId, text);
            } catch (error) {
                console.error("Error sending message:", error);
            }
        }

        // 11. AI 응답 모의 처리
        async function simulateAIResponse(docId, userText) {
            setTimeout(async () => {
                const nowIso = new Date().toISOString();
                const newAiMessage = {
                    speaker: "AI",
                    message: `말씀하신 "${userText}"에 대해 안내해 드리겠습니다.`,
                    timestamp: nowIso
                };

                const docRef = db.collection('consultations').doc(docId);
                await docRef.update({
                    consultation_dialogue: firebase.firestore.FieldValue.arrayUnion(newAiMessage)
                });
            }, 1000);
        }

        // 12. 새 상담 문서 생성
        async function createNewSession() {
            try {
                const nowIso = new Date().toISOString();
                const customId = `session_user_12345_${Date.now()}`;

                const newConsultationData = {
                    user_id: "user_12345",
                    created_at: nowIso,
                    analysis_summary: {
                        primary_emotion: "중립",
                        mode_name: "라이프스타일 상담"
                    },
                    environmental_data: {
                        temperature: 22.5
                    },
                    consultation_dialogue: [
                        {
                            speaker: "AI",
                            message: "안녕하세요! 새 상담 세션이 시작되었습니다. 어떤 도움이 필요하신가요?",
                            timestamp: nowIso
                        }
                    ]
                };

                // 지정된 ID로 문서 생성
                await db.collection('consultations').doc(customId).set(newConsultationData);
                selectConsultation(customId);
            } catch (error) {
                console.error("Error creating new session:", error);
                alert("새 상담 세션을 생성하는데 실패했습니다.");
            }
        }

        // 13. 스크롤 하단 이동 및 HTML 이스케이프
        function scrollToBottom() {
            const wrapper = document.querySelector('.messages-wrapper');
            if (wrapper) {
                wrapper.scrollTop = wrapper.scrollHeight;
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
